name: Research 2590 Alibaba synthetic experiment
on:
  push:
    branches: [codex/graphrag-2590-e2e]
permissions:
  contents: read
jobs:
  synthetic-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install 'graphrag==3.2.0'
      - run: python -m unittest discover -s research -p 'test_alibaba_budget_proxy.py' -v
      - name: Run only when an operator-provided temporary token exists
        env:
          GRAPH_RESEARCH_TEMP_TOKEN: ${{ secrets.GRAPH_RESEARCH_TEMP_TOKEN }}
        run: |
          if [ -z "$GRAPH_RESEARCH_TEMP_TOKEN" ]; then
            echo "No temporary token: offline checks only."
          else
            python research/run_real_with_proxy.py
          fi
