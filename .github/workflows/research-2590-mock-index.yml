name: Research 2590 actual index with mock models
on:
  push:
    branches: [codex/graphrag-2590-e2e]
permissions:
  contents: read
jobs:
  actual-index:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install 'graphrag==3.2.0'
      - run: python research/mock_full_pipeline.py
