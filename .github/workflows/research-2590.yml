name: Research 2590 synthetic control
on:
  push:
    branches: [codex/graphrag-2590-cloud]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upstream-functions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install published GraphRAG version
        run: python -m pip install 'graphrag==3.2.0'
      - name: Exercise upstream functions with fake readers
        run: python research/test_update_boundary.py
